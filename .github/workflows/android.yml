name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK · offline-first SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build offline-first web app (www)
        run: |
          npm run mobile:build
          test -f www/index.html
          test -f www/assets/css/app.css
          for f in main store ui charts maya sync; do test -f "www/assets/js/$f.js"; done
          for f in dashboard scripts maya publishing monetization settings; do test -f "www/assets/js/views/$f.js"; done
          grep -q "assets/js/main.js" www/index.html
          echo "www build verified: entry point + all modules present"

      - name: Configure Capacitor + sync native project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
