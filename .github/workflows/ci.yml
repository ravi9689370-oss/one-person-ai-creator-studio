name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Typecheck · Next build · Test suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./creator-studio.db
      NEXTAUTH_SECRET: ci-build-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build (next build)
        run: npx next build

      - name: Unit tests (vitest, isolated test DB)
        run: npm test
